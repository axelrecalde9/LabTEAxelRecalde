<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Generador de Password</title>
	<link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
<div class="contenedor">

	<h1>Generador de Contraseñas</h1>

	<input type="text" id="espacioblanco" readonly>
	<button id="copiar">Copiar</button>

	<label for="tamanho">Tamaño de la contraseña</label>
	<input type="number" id="tamanho">
	
	<label for="mayusculas">Incluir mayúsculas</label>
	<input type="checkbox" id="mayusculas">
	
	<label for="minusculas">Incluir minúsculas</label>
	<input type="checkbox" id="minusculas">
	
	<label for="numeros">Incluir números</label>
	<input type="checkbox" id="numeros">
	
	<label for="simbolos">Incluir símbolos</label>
	<input type="checkbox" id="simbolos">
	
	<button id="boton">Generar contraseña</button>
	<p id = "condicion"></p>
</div>
<script src="script.js"></script>
</body>
</html>
